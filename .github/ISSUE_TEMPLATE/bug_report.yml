name: Bug report
description: Report a reproducible ReFlux problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post document URLs, encryption keys, server addresses or sensitive logs. Report security vulnerabilities privately as described in docs/en/SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use placeholders for all private values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReFlux version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Android/OS version, device architecture and exit-node distribution.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed URLs, keys, tokens, server addresses and other private data.
          required: true
